<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef0e8" />
    <meta
      name="description"
      content="A neural network powered by SVG. Draw a digit and let the image recognize it."
    />
    <title>Brain.svg - An SVG neural network</title>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1><span aria-hidden="true">▦</span> Brain<span class="suffix">.svg</span></h1>
        <p>A neural network powered by SVG.</p>
      </div>
      <nav class="header-links" aria-label="Project links">
        <a href="https://x.com/so1v3" target="_blank" rel="noreferrer" aria-label="Ray on X">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26L22.827 21.75H16.17l-5.214-6.817-5.964 6.817H1.682l7.73-8.835L.75 2.25h6.826l4.713 6.231 5.955-6.231Zm-1.161 17.52h1.833L6.582 4.126H4.615L17.083 19.77Z"
            />
          </svg>
          <span>X</span>
        </a>
        <a
          class="github-link"
          href="https://github.com/so1ve/brain.svg"
          target="_blank"
          rel="noreferrer"
          aria-label="Brain.svg on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.29-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.64 0c2.15-1.46 3.09-1.15 3.09-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.08v3.11c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </nav>
    </header>
    <main class="lab" aria-label="Handwritten digit recognition">
      <section class="panel" aria-labelledby="input-title">
        <div class="panel-heading">
          <h2 id="input-title">Draw</h2>
          <span>0–9</span>
        </div>
        <div class="canvas-frame">
          <canvas
            id="drawing"
            width="320"
            height="320"
            aria-label="Draw a digit with your mouse, pen, or touch"
          ></canvas>
          <span id="canvas-hint" class="canvas-hint">Draw a digit</span>
        </div>
        <div class="controls">
          <button id="undo" type="button" disabled>Undo</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
      </section>
      <span class="flow-arrow" aria-hidden="true">→</span>
      <section class="panel" aria-labelledby="output-title">
        <div class="panel-heading">
          <h2 id="output-title">SVG</h2>
          <span id="render-status" role="status">Loading…</span>
        </div>
        <div class="svg-frame" id="result-frame" aria-busy="false">
          <canvas
            id="brain-image"
            width="480"
            height="300"
            role="img"
            aria-label="Prediction and input pixels rendered by SVG"
          ></canvas>
          <div id="recognition-progress" class="recognition-progress" aria-hidden="true" hidden>
            <span class="recognition-spinner"></span><span>Recognizing…</span>
          </div>
          <div id="load-error" class="load-error" role="alert" hidden></div>
        </div>
      </section>
    </main>
    <footer>
      <a href="https://yann.lecun.org/exdb/mnist/" target="_blank" rel="noreferrer">MNIST</a>
      <a
        href="https://archive.ics.uci.edu/dataset/80/optical+recognition+of+handwritten+digits"
        target="_blank"
        rel="noreferrer"
        >UCI Optdigits · CC BY 4.0</a
      >
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
